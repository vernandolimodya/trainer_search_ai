<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Focus - Trainer Results</title>

    <!-- Google Fonts: DM Sans -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #000000, #737373);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        /* Loading Screen (Same Background as Index) */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(45deg, #000000, #737373); /* Matching gradient */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            z-index: 999;
        }

        /* Dot animation for "..." effect */
        .loading-text::after {
            content: "";
            display: inline-block;
            animation: dots 1.5s infinite steps(3);
        }

        @keyframes dots {
            0% { content: ""; }
            33% { content: "."; }
            66% { content: ".."; }
            100% { content: "..."; }
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(50px);
            animation: fadeUp 1s ease-out forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            position: absolute;
            top: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            line-height: 1.1;
        }

        .header span.send {
            font-size: 20px;
            font-weight: 400;
            display: block;
        }

        .header span.focus {
            font-size: 50px;
            font-weight: 700;
        }

        /* Stack trainer boxes vertically */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 100px;
            width: 80%;
            max-width: 600px; /* Prevents excessive stretching */
        }

        .trainer-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: 0.3s;
        }

        .trainer-box:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <p class="loading-text">Searching for trainers</p>
    </div>

    <div class="header fade-in" style="animation-delay: 0.2s;">
        <span class="send">SEND</span>
        <span class="focus">FOCUS</span>
    </div>

    <h2 class="fade-in" style="animation-delay: 0.4s;">Results for: {{ query }}</h2>

    <div class="container fade-in" style="animation-delay: 0.6s;">
        {% for trainer in trainers %}
            <div class="trainer-box fade-in" style="animation-delay: {{ loop.index * 0.2 + 0.6 }}s;">
                <strong>Name:</strong> {{ trainer.name }}<br><br>
                <strong>Bio:</strong> {{ trainer.bio }}
            </div>
        {% endfor %}
    </div>

    <div class="footer fade-in" style="animation-delay: 1.2s;">
        © Copyright Vernando Limodya
    </div>

    <script>
        // Hide loading screen after the page fully loads
        window.onload = function () {
            setTimeout(() => {
                document.getElementById("loading-screen").style.display = "none";
            }, 1500); // Keep loading screen for at least 1.5 seconds
        };
    </script>

</body>
</html>
