<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Focus - Find Your Trainer</title>

    <!-- Google Fonts: DM Sans -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #000000, #737373);
            color: white;
            text-align: center;
            overflow: hidden;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out; /* Smooth fade-out transition */
        }

        .fade-out {
            opacity: 0;
            transform: translateY(50px); /* Drop down effect */
        }

        .header {
            position: absolute;
            top: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            line-height: 1.1;
        }

        .header span.send {
            font-size: 20px;
            font-weight: 400;
            display: block;
        }

        .header span.focus {
            font-size: 50px;
            font-weight: 700;
        }

        .main-container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            align-items: center;
            justify-content: space-between;
            margin-top: 100px;
        }

        .left-text {
            flex: 1;
            font-size: 50px;
            font-weight: 700;
            line-height: 1.2;
            max-width: 500px;
            text-align: left;
        }

        .right-input {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .textbox {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            outline: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .textbox::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .submit-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: black;
            color: white;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="send">SEND</span>
        <span class="focus">FOCUS</span>
    </div>

    <div class="main-container">
        <div class="left-text">
            Create your path.<br> Achieve your goals.
        </div>

        <div class="right-input">
            <div class="input-title">Find your trainer today!</div>
            <input type="text" class="textbox" id="prompt" placeholder="Tell us about yourself ...">
            <button class="submit-btn" onclick="submitPrompt()">Submit</button>
        </div>
    </div>

    <div class="footer">
        © Copyright Vernando Limodya
    </div>

    <script>
        function submitPrompt() {
            let query = document.getElementById("prompt").value;
            if (query.trim() !== "") {
                // Apply fade-out effect
                document.body.classList.add("fade-out");

                // Wait for the animation to complete before redirecting
                setTimeout(() => {
                    window.location.href = `http://127.0.0.1:5000/results/${encodeURIComponent(query)}`;
                }, 800); // Matches the CSS transition duration
            } else {
                alert("Please enter a valid query!");
            }
        }
    </script>

</body>
</html>
